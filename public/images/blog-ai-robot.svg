<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgRobot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C4DEF6" />
      <stop offset="100%" stopColor="#DBECFA" />
    </linearGradient>
    <filter id="clayShadowRobot" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#4D749B" flood-opacity="0.28" />
    </filter>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>
    <linearGradient id="visorBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <linearGradient id="windowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E0F2FE" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="36" fill="url(#bgRobot)" />

  <!-- UI Window (Behind robot on the right) -->
  <g transform="translate(380, 80) rotate(-3 200 180)" filter="url(#clayShadowRobot)">
    <rect width="320" height="320" rx="28" fill="url(#windowBlue)" />
    
    <!-- Header -->
    <circle cx="34" cy="30" r="5" fill="#EF4444" />
    <circle cx="50" cy="30" r="5" fill="#F59E0B" />
    <circle cx="66" cy="30" r="5" fill="#10B981" />

    <!-- Big Photo / Card placeholder -->
    <rect x="30" y="65" width="160" height="110" rx="18" fill="#93C5FD" />
    <circle cx="65" cy="95" r="14" fill="#FFFFFF" fill-opacity="0.9" />
    <polygon points="45,155 85,115 130,155" fill="#BFDBFE" />
    <polygon points="105,155 145,125 175,155" fill="#DBEAFE" />

    <!-- Grid cards below -->
    <rect x="30" y="195" width="120" height="45" rx="12" fill="#E2E8F0" />
    <rect x="165" y="195" width="120" height="45" rx="12" fill="#E2E8F0" />
    <rect x="30" y="250" width="120" height="45" rx="12" fill="#E2E8F0" />
    <rect x="165" y="250" width="120" height="45" rx="12" fill="#E2E8F0" />

    <!-- Sidebar controls on right -->
    <rect x="210" y="65" width="80" height="14" rx="7" fill="#CBD5E1" />
    <rect x="210" y="90" width="60" height="10" rx="5" fill="#E2E8F0" />
    <rect x="210" y="115" width="70" height="24" rx="12" fill="#3B82F6" />
  </g>

  <!-- Cute 3D White Robot (Left foreground) -->
  <g transform="translate(130, 90)" filter="url(#clayShadowRobot)">
    <!-- Antenna -->
    <line x1="140" y1="40" x2="140" y2="70" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
    <circle cx="140" cy="34" r="10" fill="#38BDF8" />

    <!-- Robot Head -->
    <rect x="65" y="70" width="150" height="120" rx="45" fill="url(#robotBody)" />
    <!-- Visor -->
    <rect x="85" y="95" width="110" height="60" rx="26" fill="url(#visorBlue)" />
    <!-- Glowing Eyes -->
    <circle cx="115" cy="125" r="11" fill="#FFFFFF" />
    <circle cx="165" cy="125" r="11" fill="#FFFFFF" />
    <!-- Cheeks blush -->
    <circle cx="80" cy="145" r="6" fill="#F472B6" fill-opacity="0.5" />
    <circle cx="200" cy="145" r="6" fill="#F472B6" fill-opacity="0.5" />

    <!-- Robot Neck -->
    <rect x="120" y="188" width="40" height="14" rx="7" fill="#64748B" />

    <!-- Robot Body -->
    <rect x="75" y="200" width="130" height="130" rx="36" fill="url(#robotBody)" />
    <!-- Chest plate / badge -->
    <rect x="95" y="225" width="90" height="60" rx="18" fill="#F1F5F9" />
    <circle cx="120" cy="255" r="8" fill="#38BDF8" />
    <circle cx="160" cy="255" r="8" fill="#34D399" />

    <!-- Robot Arm holding Photo Frame -->
    <path d="M 190 220 C 230 220 250 250 240 280" fill="none" stroke="#E2E8F0" stroke-width="20" stroke-linecap="round" />
    
    <!-- Photo Frame held by robot -->
    <g transform="translate(200, 160) rotate(12)">
      <rect width="80" height="90" rx="14" fill="#FFFFFF" filter="url(#clayShadowRobot)" />
      <rect x="8" y="8" width="64" height="74" rx="8" fill="#38BDF8" />
      <polygon points="16,68 40,42 72,68" fill="#BAE6FD" />
      <circle cx="32" cy="28" r="8" fill="#FFFFFF" />
    </g>
  </g>
</svg>
