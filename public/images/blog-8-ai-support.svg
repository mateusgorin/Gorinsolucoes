<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7D6CF0" />
      <stop offset="100%" stopColor="#8E7EFA" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#312666" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#312666" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#312666" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Orbiting Rings with Beads -->
    <ellipse cx="400" cy="230" rx="270" ry="75" fill="none" stroke="#C4B5FD" stroke-width="3" stroke-dasharray="10 8" transform="rotate(-15 400 230)" />
    <circle cx="160" cy="270" r="10" fill="#FDE047" />
    <circle cx="630" cy="180" r="10" fill="#38BDF8" />

    <!-- Cute 3D Spherical White Robot in Center -->
    <g transform="translate(310, 100)" filter="url(#softShadow)">
      <line x1="90" y1="20" x2="90" y2="50" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />
      <circle cx="90" cy="16" r="10" fill="#38BDF8" />
      <!-- Spherical Head Face -->
      <circle cx="90" cy="115" r="72" fill="#FFFFFF" />
      <!-- Visor -->
      <rect x="45" y="85" width="90" height="52" rx="24" fill="#0F172A" />
      <circle cx="68" cy="110" r="11" fill="#38BDF8" />
      <circle cx="112" cy="110" r="11" fill="#38BDF8" />
      <!-- Collar and Body -->
      <ellipse cx="90" cy="185" rx="42" ry="16" fill="#6366F1" />
      <rect x="65" y="195" width="50" height="40" rx="18" fill="#FFFFFF" />
    </g>

    <!-- Floating Yellow File Folders -->
    <g transform="translate(560, 110) rotate(15)" filter="url(#softShadow)">
      <rect width="60" height="45" rx="8" fill="#F59E0B" />
      <rect x="5" y="5" width="25" height="10" rx="4" fill="#D97706" />
    </g>
    <g transform="translate(560, 260) rotate(-10)" filter="url(#softShadow)">
      <rect width="60" height="45" rx="8" fill="#F59E0B" />
      <rect x="5" y="5" width="25" height="10" rx="4" fill="#D97706" />
    </g>

    <!-- Orbiting Chat Capsules on Left -->
    <g transform="translate(140, 120) rotate(-8)" filter="url(#softShadow)">
      <rect width="130" height="42" rx="21" fill="#FFFFFF" />
      <rect x="25" y="16" width="80" height="10" rx="5" fill="#6366F1" />
    </g>
    <g transform="translate(130, 240) rotate(6)" filter="url(#softShadow)">
      <rect width="120" height="38" rx="19" fill="#C084FC" />
      <circle cx="35" cy="19" r="6" fill="#FFFFFF" />
      <circle cx="60" cy="19" r="6" fill="#FFFFFF" />
      <circle cx="85" cy="19" r="6" fill="#FFFFFF" />
    </g>
</svg>