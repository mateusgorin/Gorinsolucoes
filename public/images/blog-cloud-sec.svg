<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#CBE2F8" />
      <stop offset="100%" stopColor="#DFEFFF" />
    </linearGradient>
    <filter id="clayShadowCloud" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#36658C" flood-opacity="0.25" />
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0EA5E9" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="36" fill="url(#bgCloud)" />

  <!-- 3D Cloud Base -->
  <g transform="translate(180, 140)" filter="url(#clayShadowCloud)">
    <ellipse cx="220" cy="180" rx="200" ry="90" fill="#FFFFFF" />
    <circle cx="160" cy="120" r="85" fill="#FFFFFF" />
    <circle cx="270" cy="100" r="105" fill="#FFFFFF" />
    <circle cx="340" cy="130" r="75" fill="#FFFFFF" />
  </g>

  <!-- 3D Security Shield & Padlock -->
  <g transform="translate(330, 120)" filter="url(#clayShadowCloud)">
    <!-- Shield -->
    <path d="M 70 30 L 130 55 C 130 115 70 160 70 160 C 70 160 10 115 10 55 Z" fill="url(#shieldGrad)" />
    
    <!-- Padlock inside shield -->
    <rect x="52" y="90" width="36" height="30" rx="8" fill="#FFFFFF" />
    <path d="M 60 90 L 60 76 C 60 70 80 70 80 76 L 80 90" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <circle cx="70" cy="103" r="4" fill="#0284C7" />
  </g>
</svg>
