<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F9B864" />
      <stop offset="100%" stopColor="#FAC67A" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#66451C" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#66451C" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#66451C" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Volumetric Puffy Golden-Cream Cloud -->
    <g transform="translate(180, 110)" filter="url(#softShadow)">
      <ellipse cx="230" cy="160" rx="190" ry="80" fill="#FEF3C7" />
      <circle cx="150" cy="100" r="85" fill="#FFFBEB" />
      <circle cx="250" cy="75" r="105" fill="#FFFFFF" />
      <circle cx="340" cy="115" r="75" fill="#FEF3C7" />
    </g>
    <!-- Heavy 3D Brass/Gold Padlock in Center -->
    <g transform="translate(340, 130)" filter="url(#softShadow)">
      <!-- Metallic Rainbow Shackle -->
      <path d="M 40 90 L 40 50 C 40 30 85 30 85 50 L 85 90" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" />
      <!-- Padlock Body -->
      <rect x="20" y="80" width="85" height="75" rx="18" fill="url(#gold)" />
      <!-- Keyhole -->
      <circle cx="62" cy="112" r="7" fill="#78350F" />
      <polygon points="58,112 66,112 68,130 56,130" fill="#78350F" />
    </g>
    <!-- Floating Glassmorphic Shield on Left -->
    <g transform="translate(180, 190)" filter="url(#softShadow)">
      <path d="M 45 10 L 85 28 C 85 75 45 105 45 105 C 45 105 5 75 5 28 Z" fill="url(#glassCard)" stroke="#0284C7" stroke-width="2.5" />
      <rect x="35" y="50" width="20" height="18" rx="4" fill="#0284C7" />
      <path d="M 40 50 L 40 40 C 40 36 50 36 50 40 L 50 50" fill="none" stroke="#0284C7" stroke-width="3" />
    </g>
    <!-- Floating Glassmorphic Shield on Right -->
    <g transform="translate(540, 130)" filter="url(#softShadow)">
      <path d="M 40 10 L 75 25 C 75 65 40 90 40 90 C 40 90 5 65 5 25 Z" fill="url(#glassCard)" stroke="#10B981" stroke-width="2.5" />
      <polyline points="25,48 35,58 55,38" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
</svg>