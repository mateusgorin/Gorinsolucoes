<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8BD5C8" />
      <stop offset="100%" stopColor="#9FE0D5" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#1C5248" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#1C5248" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#1C5248" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Analytics Window in background -->
    <g transform="translate(230, 80) rotate(-8 100 80)" filter="url(#softShadow)">
      <rect width="180" height="120" rx="18" fill="#FFFFFF" />
      <rect x="20" y="60" width="20" height="40" rx="6" fill="#F87171" />
      <rect x="50" y="40" width="20" height="60" rx="6" fill="#38BDF8" />
      <rect x="80" y="30" width="20" height="70" rx="6" fill="#10B981" />
      <rect x="110" y="50" width="20" height="50" rx="6" fill="#FBBF24" />
    </g>
    <!-- Stepped 3D Bar Chart Pillars in Isometric Perspective -->
    <g transform="translate(230, 140)" filter="url(#softShadow)">
      <!-- Pillar 1 (Yellow) -->
      <g transform="translate(40, 90)">
        <polygon points="25,0 50,14 25,28 0,14" fill="#FDE047" />
        <polygon points="0,14 25,28 25,120 0,106" fill="#EAB308" />
        <polygon points="25,28 50,14 50,106 25,120" fill="#CA8A04" />
      </g>
      <!-- Pillar 2 (Coral) -->
      <g transform="translate(100, 50)">
        <polygon points="25,0 50,14 25,28 0,14" fill="#FCA5A5" />
        <polygon points="0,14 25,28 25,160 0,146" fill="#EF4444" />
        <polygon points="25,28 50,14 50,146 25,160" fill="#DC2626" />
      </g>
      <!-- Pillar 3 (Mint) -->
      <g transform="translate(160, 20)">
        <polygon points="25,0 50,14 25,28 0,14" fill="#86EFAC" />
        <polygon points="0,14 25,28 25,190 0,176" fill="#22C55E" />
        <polygon points="25,28 50,14 50,176 25,190" fill="#16A34A" />
      </g>
      <!-- Pillar 4 (Blue Top Rank) -->
      <g transform="translate(220, -20)">
        <polygon points="25,0 50,14 25,28 0,14" fill="#7DD3FC" />
        <polygon points="0,14 25,28 25,230 0,216" fill="#0284C7" />
        <polygon points="25,28 50,14 50,216 25,230" fill="#0369A1" />
      </g>
    </g>
    <!-- Hovering 3D Magnifying Glass in Front -->
    <g transform="translate(430, 180) rotate(-20)" filter="url(#softShadow)">
      <circle cx="55" cy="55" r="46" fill="url(#glassCard)" stroke="#6366F1" stroke-width="12" />
      <rect x="49" y="100" width="12" height="65" rx="6" fill="#1E1B4B" />
    </g>
    <!-- Floating 3D Donut/Pie Chart Ring at Top Right -->
    <g transform="translate(560, 140)" filter="url(#softShadow)">
      <circle cx="35" cy="35" r="30" fill="none" stroke="#FDE047" stroke-width="14" stroke-dasharray="60 180" />
      <circle cx="35" cy="35" r="30" fill="none" stroke="#F87171" stroke-width="14" stroke-dasharray="60 180" stroke-dashoffset="-60" />
      <circle cx="35" cy="35" r="30" fill="none" stroke="#38BDF8" stroke-width="14" stroke-dasharray="60 180" stroke-dashoffset="-120" />
    </g>
</svg>