<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgWa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#CBEBE2" />
      <stop offset="100%" stopColor="#DEF5EE" />
    </linearGradient>
    <filter id="clayShadowWa" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#2D5C4E" flood-opacity="0.25" />
    </filter>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22C55E" />
      <stop offset="100%" stopColor="#16A34A" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="36" fill="url(#bgWa)" />

  <!-- 3D Smartphone tilted -->
  <g transform="translate(260, 60) rotate(-6 140 190)" filter="url(#clayShadowWa)">
    <!-- Phone Bezel -->
    <rect width="280" height="380" rx="40" fill="url(#phoneBody)" />
    <!-- Screen -->
    <rect x="14" y="14" width="252" height="352" rx="30" fill="#FFFFFF" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="100" y="24" width="80" height="18" rx="9" fill="#0F172A" />

    <!-- Chat Message Bubble 1 (Client) -->
    <rect x="30" y="80" width="160" height="40" rx="16" fill="#F1F5F9" />
    <rect x="44" y="94" width="130" height="12" rx="6" fill="#CBD5E1" />

    <!-- Chat Message Bubble 2 (WhatsApp Response) -->
    <rect x="80" y="140" width="170" height="50" rx="18" fill="url(#waGreen)" filter="url(#clayShadowWa)" />
    <text x="165" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">💬 Olá! Projeto iniciado.</text>

    <!-- Mini UI Cards on screen -->
    <rect x="30" y="210" width="220" height="60" rx="16" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="58" cy="240" r="14" fill="#22C55E" />
    <rect x="86" y="234" width="110" height="12" rx="6" fill="#94A3B8" />

    <!-- Big Green CTA at bottom of phone -->
    <rect x="30" y="295" width="220" height="46" rx="23" fill="url(#waGreen)" />
    <text x="140" y="324" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">⚡ Conversão Direta</text>
  </g>

  <!-- Floating 3D Badge: WhatsApp icon on right -->
  <g transform="translate(560, 160)" filter="url(#clayShadowWa)">
    <circle cx="50" cy="50" r="45" fill="url(#waGreen)" />
    <path d="M 50 25 C 36 25 25 36 25 50 C 25 55 26.5 60 29 64 L 25 75 L 37 72 C 41 74 45 75 50 75 C 64 75 75 64 75 50 C 75 36 64 25 50 25 Z" fill="#FFFFFF" />
  </g>
</svg>
