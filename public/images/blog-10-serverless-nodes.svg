<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8EA88E" />
      <stop offset="100%" stopColor="#9EB89E" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#344A34" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#344A34" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#344A34" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Glowing Conduits (Cyan and Purple) -->
    <g transform="translate(170, 110)" filter="url(#softShadow)">
      <path d="M 100 160 C 100 80 200 80 200 140" fill="none" stroke="#00D4FF" stroke-width="12" stroke-linecap="round" />
      <path d="M 360 160 C 360 80 260 80 260 140" fill="none" stroke="#C084FC" stroke-width="12" stroke-linecap="round" />
      <line x1="100" y1="160" x2="100" y2="240" stroke="#00D4FF" stroke-width="12" stroke-linecap="round" />
      <line x1="360" y1="160" x2="360" y2="240" stroke="#C084FC" stroke-width="12" stroke-linecap="round" />
    </g>
    <!-- Clouds hovering on top of pipeline risers -->
    <g transform="translate(160, 100)" filter="url(#softShadow)">
      <circle cx="50" cy="40" r="30" fill="#FFFFFF" />
      <circle cx="75" cy="35" r="24" fill="#FFFFFF" />
      <circle cx="30" cy="45" r="20" fill="#FFFFFF" />
    </g>
    <g transform="translate(510, 80)" filter="url(#softShadow)">
      <circle cx="50" cy="40" r="30" fill="#FFFFFF" />
      <circle cx="75" cy="35" r="24" fill="#FFFFFF" />
      <circle cx="30" cy="45" r="20" fill="#FFFFFF" />
    </g>
    <!-- Stacked 3D Server Cylinder Unit in Center -->
    <g transform="translate(320, 95)" filter="url(#softShadow)">
      <!-- Tier 3 (Bottom) -->
      <g transform="translate(0, 120)">
        <ellipse cx="80" cy="55" rx="80" ry="28" fill="#475569" />
        <rect x="0" y="28" width="160" height="28" fill="#64748B" />
        <ellipse cx="80" cy="28" rx="80" ry="28" fill="#94A3B8" />
        <circle cx="45" cy="32" r="5" fill="#38BDF8" />
        <circle cx="65" cy="32" r="5" fill="#34D399" />
      </g>
      <!-- Tier 2 (Middle) -->
      <g transform="translate(0, 60)">
        <ellipse cx="80" cy="55" rx="80" ry="28" fill="#475569" />
        <rect x="0" y="28" width="160" height="28" fill="#64748B" />
        <ellipse cx="80" cy="28" rx="80" ry="28" fill="#94A3B8" />
        <circle cx="45" cy="32" r="5" fill="#38BDF8" />
        <circle cx="65" cy="32" r="5" fill="#34D399" />
      </g>
      <!-- Tier 1 (Top) -->
      <g transform="translate(0, 0)">
        <ellipse cx="80" cy="55" rx="80" ry="28" fill="#475569" />
        <rect x="0" y="28" width="160" height="28" fill="#64748B" />
        <ellipse cx="80" cy="28" rx="80" ry="28" fill="#CBD5E1" />
        <circle cx="80" cy="28" rx="50" ry="18" fill="#334155" />
      </g>
    </g>
</svg>