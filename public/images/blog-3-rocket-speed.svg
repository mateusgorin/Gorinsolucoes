<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F99B77" />
      <stop offset="100%" stopColor="#FAAB8D" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#662D1D" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#662D1D" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#662D1D" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Massive Voluminous Puffy Smoke Cloud -->
    <g transform="translate(180, 200)" filter="url(#softShadow)">
      <ellipse cx="220" cy="120" rx="180" ry="75" fill="#FFF7ED" />
      <circle cx="160" cy="80" r="75" fill="#FFFFFF" />
      <circle cx="250" cy="60" r="95" fill="#FFF7ED" />
      <circle cx="340" cy="90" r="70" fill="#FFEDD5" />
      <circle cx="110" cy="110" r="55" fill="#FED7AA" />
      <circle cx="290" cy="120" r="60" fill="#FED7AA" />
    </g>
    <!-- 3D Rocket Launching up-right -->
    <g transform="translate(380, 50) rotate(42 90 110)" filter="url(#softShadow)">
      <!-- Flame Plume -->
      <path d="M 75 190 C 50 260 110 300 90 350 C 130 300 150 260 115 190 Z" fill="#F59E0B" />
      <path d="M 82 190 C 65 240 105 260 95 295 C 120 260 130 240 108 190 Z" fill="#FEF08A" />
      <!-- Purple Fins -->
      <polygon points="55,165 15,210 65,195" fill="#7C3AED" />
      <polygon points="125,165 165,210 115,195" fill="#7C3AED" />
      <!-- White Fuselage -->
      <path d="M 90 30 C 140 75 130 165 125 195 L 55 195 C 50 165 40 75 90 30 Z" fill="#FFFFFF" />
      <!-- Purple Nosecone -->
      <path d="M 90 30 C 115 65 120 100 120 105 L 60 105 C 60 100 65 65 90 30 Z" fill="#7C3AED" />
      <!-- Porthole with Cyan Ring -->
      <circle cx="90" cy="135" r="22" fill="#FFFFFF" stroke="#00D4FF" stroke-width="5" />
      <circle cx="90" cy="135" r="14" fill="#1E1B4B" />
      <ellipse cx="85" cy="130" rx="5" ry="2.5" fill="#FFFFFF" />
    </g>
    <!-- Floating 3D Golden Stars -->
    <g transform="translate(240, 110)" filter="url(#softShadow)">
      <polygon points="20,0 26,12 38,15 29,24 31,37 20,30 9,37 11,24 2,15 14,12" fill="#FDE047" />
    </g>
    <g transform="translate(560, 180)" filter="url(#softShadow)">
      <polygon points="16,0 21,10 30,12 23,19 25,30 16,24 7,30 9,19 2,12 11,10" fill="#FDE047" />
    </g>
</svg>