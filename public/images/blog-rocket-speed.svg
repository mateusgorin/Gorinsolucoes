<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgRocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D8CEFA" />
      <stop offset="100%" stopColor="#EADFFC" />
    </linearGradient>
    <filter id="clayShadowRocket" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="18" stdDeviation="16" flood-color="#4B3B8A" flood-opacity="0.25" />
    </filter>
    <linearGradient id="rocketBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="rocketNose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#BE123C" />
    </linearGradient>
    <linearGradient id="exhaustFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F97316" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="36" fill="url(#bgRocket)" />

  <!-- Background decorative 3D floating spheres with question marks / icons -->
  <g transform="translate(140, 100)" filter="url(#clayShadowRocket)">
    <circle cx="40" cy="40" r="38" fill="#F1F5F9" />
    <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900" fill="#94A3B8" text-anchor="middle">?</text>
  </g>
  <g transform="translate(620, 290)" filter="url(#clayShadowRocket)">
    <circle cx="35" cy="35" r="32" fill="#F1F5F9" />
    <text x="35" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" fill="#94A3B8" text-anchor="middle">?</text>
  </g>

  <!-- Giant 3D Rocket blasting through center -->
  <g transform="translate(240, 60) rotate(42 200 200)" filter="url(#clayShadowRocket)">
    <!-- Exhaust plume -->
    <path d="M 120 280 C 100 360 140 400 135 440 C 160 400 180 360 160 280 Z" fill="url(#exhaustFlame)" />
    <path d="M 130 280 C 120 330 145 350 140 370 C 150 350 160 330 150 280 Z" fill="#FEF08A" />

    <!-- Left Wing -->
    <polygon points="90,240 50,290 100,280" fill="#DC2626" />
    <!-- Right Wing -->
    <polygon points="190,240 230,290 180,280" fill="#DC2626" />

    <!-- Rocket Fuselage -->
    <path d="M 140 60 C 195 120 185 240 180 280 L 100 280 C 95 240 85 120 140 60 Z" fill="url(#rocketBodyGrad)" />
    
    <!-- Rocket Nosecone -->
    <path d="M 140 60 C 160 90 170 120 170 130 L 110 130 C 110 120 120 90 140 60 Z" fill="url(#rocketNose)" />

    <!-- Porthole Window -->
    <circle cx="140" cy="180" r="28" fill="#FFFFFF" stroke="#93C5FD" stroke-width="5" />
    <circle cx="140" cy="180" r="18" fill="#38BDF8" />
    <ellipse cx="134" cy="174" rx="6" ry="3" fill="#FFFFFF" />
  </g>

  <!-- Speed clouds below -->
  <ellipse cx="400" cy="450" rx="180" ry="40" fill="#FFFFFF" fill-opacity="0.4" />
</svg>
