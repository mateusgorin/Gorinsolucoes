<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#85B8F2" />
      <stop offset="100%" stopColor="#97C5F9" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#1C3D66" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#1C3D66" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#1C3D66" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Network beads stalks on left & right -->
    <g transform="translate(110, 160)" filter="url(#softShadow)">
      <line x1="40" y1="90" x2="100" y2="40" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <line x1="40" y1="90" x2="80" y2="120" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="40" cy="90" r="18" fill="#F97316" />
      <circle cx="100" cy="40" r="22" fill="#14B8A6" />
      <circle cx="80" cy="120" r="16" fill="#A855F7" />
    </g>
    <g transform="translate(600, 120)" filter="url(#softShadow)">
      <line x1="40" y1="60" x2="80" y2="20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="40" cy="60" r="16" fill="#3B82F6" />
      <circle cx="80" cy="20" r="22" fill="#A855F7" />
    </g>
    <!-- Back Dark Code Editor Window (3D Extrusion) -->
    <g transform="translate(200, 70) rotate(-6 150 150)" filter="url(#softShadow)">
      <polygon points="0,270 20,286 280,286 260,270" fill="#0F141F" />
      <polygon points="260,0 280,16 280,286 260,270" fill="#0A0E17" />
      <rect width="260" height="270" rx="28" fill="#182030" stroke="#2D3A52" stroke-width="2" />
      <circle cx="32" cy="30" r="6" fill="#F87171" />
      <circle cx="52" cy="30" r="6" fill="#FBBF24" />
      <circle cx="72" cy="30" r="6" fill="#34D399" />
      <!-- Code lines -->
      <rect x="35" y="70" width="50" height="10" rx="5" fill="#F43F5E" />
      <rect x="95" y="70" width="80" height="10" rx="5" fill="#38BDF8" />
      <rect x="55" y="100" width="110" height="10" rx="5" fill="#FBBF24" />
      <rect x="175" y="100" width="50" height="10" rx="5" fill="#34D399" />
      <rect x="55" y="130" width="70" height="10" rx="5" fill="#C084FC" />
      <rect x="135" y="130" width="90" height="10" rx="5" fill="#F472B6" />
      <rect x="75" y="160" width="100" height="10" rx="5" fill="#38BDF8" />
      <rect x="75" y="190" width="110" height="10" rx="5" fill="#FBBF24" />
      <rect x="35" y="220" width="60" height="10" rx="5" fill="#F43F5E" />
    </g>
    <!-- Front Frosted Glass Panel -->
    <g transform="translate(350, 140) rotate(8 130 110)" filter="url(#softShadow)">
      <polygon points="0,200 16,214 246,214 230,200" fill="#CBD5E1" />
      <polygon points="230,0 246,14 246,214 230,200" fill="#94A3B8" />
      <rect width="230" height="200" rx="24" fill="url(#glassCard)" stroke="#FFFFFF" stroke-width="2.5" />
      <rect x="25" y="40" width="40" height="8" rx="4" fill="#38BDF8" />
      <rect x="75" y="40" width="60" height="8" rx="4" fill="#F472B6" />
      <rect x="25" y="65" width="80" height="8" rx="4" fill="#FBBF24" />
      <rect x="115" y="65" width="50" height="8" rx="4" fill="#34D399" />
      <rect x="40" y="90" width="70" height="8" rx="4" fill="#A855F7" />
      <rect x="40" y="115" width="90" height="8" rx="4" fill="#38BDF8" />
      <rect x="25" y="145" width="140" height="28" rx="14" fill="#3B82F6" />
    </g>
</svg>