<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A892EE" />
      <stop offset="100%" stopColor="#B7A2F7" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#3E2F66" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#3E2F66" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#3E2F66" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Tilted 3D Smartphone -->
    <g transform="translate(280, 50) rotate(-10 130 180)" filter="url(#softShadow)">
      <polygon points="0,350 20,368 260,368 240,350" fill="#312E81" />
      <polygon points="240,0 260,18 260,368 240,350" fill="#1E1B4B" />
      <rect width="240" height="350" rx="42" fill="#4338CA" stroke="#6366F1" stroke-width="2" />
      <rect x="12" y="12" width="216" height="326" rx="32" fill="#FFFFFF" />
      <!-- Top speaker notch -->
      <rect x="80" y="24" width="80" height="16" rx="8" fill="#1E1B4B" />
      <!-- Message Pill 1 (White puffy with 3 dots) -->
      <g transform="translate(20, 65)" filter="url(#softShadow)">
        <rect width="140" height="48" rx="24" fill="#F1F5F9" />
        <circle cx="45" cy="24" r="7" fill="#94A3B8" />
        <circle cx="70" cy="24" r="7" fill="#94A3B8" />
        <circle cx="95" cy="24" r="7" fill="#94A3B8" />
      </g>
      <!-- Message Pill 2 (Blue with dots on left) -->
      <g transform="translate(-30, 140)" filter="url(#softShadow)">
        <rect width="130" height="44" rx="22" fill="#60A5FA" />
        <circle cx="40" cy="22" r="6" fill="#FFFFFF" />
        <circle cx="65" cy="22" r="6" fill="#FFFFFF" />
        <circle cx="90" cy="22" r="6" fill="#FFFFFF" />
      </g>
      <!-- Message Pill 3 (Coral with lines) -->
      <g transform="translate(60, 200)" filter="url(#softShadow)">
        <rect width="145" height="48" rx="24" fill="#FB7185" />
        <rect x="25" y="18" width="95" height="6" rx="3" fill="#FFFFFF" />
        <rect x="25" y="28" width="70" height="6" rx="3" fill="#FFFFFF" />
      </g>
      <!-- Yellow Notification Bell in rounded box -->
      <g transform="translate(170, 90)" filter="url(#softShadow)">
        <rect width="48" height="48" rx="16" fill="#FDE047" />
        <path d="M 24 14 C 20 14 16 18 16 24 C 16 28 14 30 12 32 L 36 32 C 34 30 32 28 32 24 C 32 18 28 14 24 14 Z" fill="#78350F" />
        <circle cx="24" cy="34" r="3" fill="#78350F" />
      </g>
    </g>
</svg>