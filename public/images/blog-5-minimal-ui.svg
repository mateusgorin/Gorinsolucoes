<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#BAF426" />
      <stop offset="100%" stopColor="#C5F838" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#3C4D1E" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#3C4D1E" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#3C4D1E" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Stacked Glass Panels -->
    <g transform="translate(200, 65) rotate(-4 180 150)" filter="url(#softShadow)">
      <!-- Back glass sheet -->
      <rect x="30" y="10" width="280" height="240" rx="26" fill="url(#glassCard)" stroke="#FFFFFF" stroke-width="2" />
      <!-- Middle glass sheet -->
      <rect x="15" y="25" width="280" height="240" rx="26" fill="url(#glassCard)" stroke="#FFFFFF" stroke-width="2" />
      <!-- Front Glass Sheet with Blueprint Cross -->
      <rect x="0" y="40" width="280" height="240" rx="26" fill="url(#frost)" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- Bounding Box -->
      <rect x="30" y="70" width="220" height="180" fill="none" stroke="#0F172A" stroke-width="2.5" />
      <line x1="30" y1="70" x2="250" y2="250" stroke="#0F172A" stroke-width="2.5" />
      <line x1="250" y1="70" x2="30" y2="250" stroke="#0F172A" stroke-width="2.5" />
      <!-- Anchor Handles -->
      <circle cx="30" cy="70" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
      <circle cx="250" cy="70" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
      <circle cx="30" cy="250" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
      <circle cx="250" cy="250" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    </g>
    <!-- Digital Stylus Pen 1 (Top right with coral body) -->
    <g transform="translate(420, 80) rotate(-35 60 60)" filter="url(#softShadow)">
      <rect x="45" y="10" width="30" height="150" rx="15" fill="#F87171" />
      <polygon points="45,160 60,210 75,160" fill="#FBBF24" />
      <circle cx="60" cy="210" r="2" fill="#0F172A" />
    </g>
    <!-- Digital Stylus Pen 2 (Left with dark body) -->
    <g transform="translate(130, 180) rotate(-55 50 50)" filter="url(#softShadow)">
      <rect x="40" y="10" width="26" height="130" rx="13" fill="#1E1B4B" />
      <polygon points="40,140 53,180 66,140" fill="#A855F7" />
    </g>
    <!-- 3D Pointer Cursor Arrow on Right -->
    <g transform="translate(460, 220) rotate(15)" filter="url(#softShadow)">
      <polygon points="0,0 35,50 22,46 12,70 0,65" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
    </g>
    <!-- Floating Isometric Cubes -->
    <g transform="translate(140, 90)" filter="url(#softShadow)">
      <polygon points="20,0 40,10 20,20 0,10" fill="#C084FC" />
      <polygon points="0,10 20,20 20,40 0,30" fill="#9333EA" />
      <polygon points="20,20 40,10 40,30 20,40" fill="#7E22CE" />
    </g>
    <g transform="translate(560, 160)" filter="url(#softShadow)">
      <polygon points="20,0 40,10 20,20 0,10" fill="#38BDF8" />
      <polygon points="0,10 20,20 20,40 0,30" fill="#0284C7" />
      <polygon points="20,20 40,10 40,30 20,40" fill="#0369A1" />
    </g>
</svg>