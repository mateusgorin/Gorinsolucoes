<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#65BFF7" />
      <stop offset="100%" stopColor="#7ACBF8" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#1C4766" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#1C4766" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#1C4766" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Shiny 3D Golden Trophy Cup in Center -->
    <g transform="translate(320, 75)" filter="url(#softShadow)">
      <!-- Handles -->
      <path d="M 0 50 C -45 50 -45 130 15 130" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" />
      <path d="M 160 50 C 205 50 205 130 145 130" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" />
      <!-- Cup Body -->
      <path d="M 15 20 L 145 20 C 145 100 115 160 80 160 C 45 160 15 100 15 20 Z" fill="url(#gold)" />
      <!-- Top Rim -->
      <ellipse cx="80" cy="20" rx="65" ry="20" fill="#FEF08A" />
      <!-- Stem -->
      <rect x="68" y="160" width="24" height="50" rx="6" fill="url(#gold)" />
      <!-- Plinth Base -->
      <polygon points="35,210 125,210 140,255 20,255" fill="#1E293B" />
      <polygon points="35,210 125,210 125,205 35,205" fill="url(#gold)" />
    </g>

    <!-- Floating 3D "A" Sphere on Left (Coral) -->
    <g transform="translate(180, 240)" filter="url(#softShadow)">
      <circle cx="48" cy="48" r="44" fill="#F43F5E" />
      <ellipse cx="38" cy="38" rx="14" ry="10" fill="#FDA4AF" fill-opacity="0.6" />
      <text x="48" y="60" font-family="sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    </g>

    <!-- Floating 3D "B" Sphere on Right (Blue) -->
    <g transform="translate(530, 95)" filter="url(#softShadow)">
      <circle cx="48" cy="48" r="44" fill="#3B82F6" />
      <ellipse cx="38" cy="38" rx="14" ry="10" fill="#93C5FD" fill-opacity="0.6" />
      <text x="48" y="60" font-family="sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
    </g>

    <!-- Floating 3D Golden Sparkle Stars -->
    <g transform="translate(190, 110)" filter="url(#softShadow)">
      <path d="M 20 0 L 25 15 L 40 20 L 25 25 L 20 40 L 15 25 L 0 20 L 15 15 Z" fill="#FDE047" />
    </g>
    <g transform="translate(520, 260)" filter="url(#softShadow)">
      <path d="M 18 0 L 22 13 L 36 18 L 22 23 L 18 36 L 14 23 L 0 18 L 14 13 Z" fill="#FDE047" />
    </g>
</svg>