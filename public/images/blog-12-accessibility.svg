<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E444B8" />
      <stop offset="100%" stopColor="#EB5CC4" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#661E52" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#661E52" flood-opacity="0.18" />
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="30%" stopColor="#FBBF24" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <!-- Glass Gradients -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="frost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stopColor="#E2E8F0" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Card Canvas with Generous Rounded Corners -->
  <rect width="800" height="450" rx="36" fill="url(#bg)" />

  <!-- Soft Ambient Studio Lighting Highlights -->
  <circle cx="200" cy="110" r="140" fill="#FFFFFF" fill-opacity="0.18" filter="url(#glassBlur)" />
  <circle cx="680" cy="360" r="130" fill="#661E52" fill-opacity="0.08" filter="url(#glassBlur)" />

  <!-- Concentric 3D Portal Rings -->
    <g transform="translate(250, 70)" filter="url(#softShadow)">
      <!-- Outer Navy Ring -->
      <circle cx="150" cy="150" r="130" fill="none" stroke="#0F172A" stroke-width="26" />
      <!-- Glowing Inner Cyan/Purple Rim -->
      <circle cx="150" cy="150" r="130" fill="none" stroke="#38BDF8" stroke-width="6" />
      <!-- Purple Core Ring -->
      <circle cx="150" cy="150" r="105" fill="#581C87" stroke="#A855F7" stroke-width="8" />
      <!-- Universal Accessibility Human Figure in White -->
      <circle cx="150" cy="95" r="20" fill="#FFFFFF" />
      <path d="M 95 138 C 125 124 175 124 205 138" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
      <line x1="150" y1="115" x2="150" y2="185" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
      <line x1="150" y1="185" x2="115" y2="235" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
      <line x1="150" y1="185" x2="185" y2="235" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" />
    </g>

    <!-- Floating 3D Pointer Cursor pointing at ring -->
    <g transform="translate(480, 240) rotate(-15)" filter="url(#softShadow)">
      <polygon points="0,0 35,50 22,46 12,70 0,65" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" stroke-linejoin="round" />
    </g>

    <!-- Floating Mechanical Gear on Left -->
    <g transform="translate(150, 110) rotate(20)" filter="url(#softShadow)">
      <circle cx="35" cy="35" r="30" fill="#38BDF8" />
      <rect x="29" y="0" width="12" height="70" rx="3" fill="#38BDF8" />
      <rect x="29" y="0" width="12" height="70" rx="3" fill="#38BDF8" transform="rotate(45 35 35)" />
      <rect x="29" y="0" width="12" height="70" rx="3" fill="#38BDF8" transform="rotate(90 35 35)" />
      <rect x="29" y="0" width="12" height="70" rx="3" fill="#38BDF8" transform="rotate(135 35 35)" />
      <circle cx="35" cy="35" r="14" fill="#FFFFFF" />
    </g>

    <!-- Floating Heart Badge on Right -->
    <g transform="translate(560, 130)" filter="url(#softShadow)">
      <rect width="45" height="42" rx="14" fill="#F43F5E" />
      <path d="M 22.5 15 C 19 10 12 12 12 18 C 12 24 22.5 30 22.5 30 C 22.5 30 33 24 33 18 C 33 12 26 10 22.5 15 Z" fill="#FFFFFF" />
    </g>
    <!-- Floating Play Capsule -->
    <g transform="translate(570, 220)" filter="url(#softShadow)">
      <rect width="45" height="42" rx="14" fill="#0F172A" />
      <polygon points="18,14 32,21 18,28" fill="#38BDF8" />
    </g>
</svg>