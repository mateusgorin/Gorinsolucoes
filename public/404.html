<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Gorin Soluções</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/webp" href="/images/mascot-trimmed.webp" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #000000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        color: #000000;
      }
      .brand img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .brand span span {
        color: #00D4FF;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8125rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #71717a;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #52525b;
        max-width: 420px;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.875rem 2rem;
        font-size: 0.9375rem;
        font-weight: 600;
        color: #ffffff;
        background-color: #000000;
        border-radius: 9999px;
        text-decoration: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .btn:hover {
        opacity: 0.85;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <a href="/" class="brand" aria-label="Gorin Soluções">
      <img src="/images/mascot-trimmed.webp" alt="Gorin Soluções" width="24" height="24" />
      <span>GORIN<span>.</span></span>
    </a>
    <div class="code">Erro 404</div>
    <h1>Página não encontrada</h1>
    <p>O link que você tentou acessar não existe ou foi removido.</p>
    <a href="/" class="btn">Voltar para o início</a>
  </body>
</html>
